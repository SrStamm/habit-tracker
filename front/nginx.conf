# Front de producción: sirve dist/ y proxya /api al backend.
# Escucha en 5173 (no 80) para no tener que tocar la config del tunnel.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # HTML: siempre revalidar (nombre sin hash, cambia en cada deploy)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash de contenido: cacheables para siempre.
    # El navegador no los vuelve a bajar y Cloudflare los cachea en edge.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API: mismo contrato que el proxy de Vite en dev (quita el prefijo /api).
    # resolver + variable: nginx resuelve hostnames al arrancar y fija el IP;
    # en docker el IP de `back` cambia al recrear el contenedor, así que se
    # re-resuelve con TTL en vez de quedarse con uno viejo.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://back:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: cualquier ruta de react-router sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
